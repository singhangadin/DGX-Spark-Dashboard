name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Semantic version increment
        required: true
        type: choice
        default: PATCH
        options:
          - PATCH
          - MINOR
          - MAJOR
      release_as:
        description: One-time explicit version such as 1.0.0 (overrides increment)
        required: false
        type: string

concurrency:
  group: dashboard-release
  cancel-in-progress: false

# Least privilege by default; the release job grants only what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/singhangadin/dgx-spark-dashboard

jobs:
  release:
    name: Version, publish, and release
    # Never run in a fork: the registry, release identity, and push targets are
    # owner-specific, and forks must not consume this workflow.
    if: github.repository == 'singhangadin/DGX-Spark-Dashboard'
    runs-on: ubuntu-latest
    # A hung emulated build must not run unbounded.
    timeout-minutes: 30
    permissions:
      contents: write # Push the release branch and tag.
      pull-requests: write # main/develop are updated only via merged PRs.
      packages: write # Publish the image to GHCR.
      attestations: write # Build provenance attestations.
      id-token: write # OIDC for provenance signing.
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release branch
        id: prepare
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          RELEASE_AS: ${{ inputs.release_as }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run releases from the main branch, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop --tags

          # main and develop are never pushed to directly; the release is staged
          # on its own branch and merged into main (and back into develop) via
          # pull requests. A normal release promotes develop; an explicit
          # release_as stages from main as-is.
          if [[ -z "$RELEASE_AS" ]]; then
            git checkout -B release-staging origin/develop
          else
            git checkout -B release-staging origin/main
          fi

          NEW_VERSION=$(python3 scripts/release/bump.py)
          TAG="v${NEW_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          python3 scripts/release/changelog.py "$PREVIOUS_TAG" HEAD > release-notes.md
          cat release-notes.md

          git add VERSION
          git commit -m "chore(release): ${TAG}"

          RELEASE_BRANCH="release/${TAG}"
          git branch -m "$RELEASE_BRANCH"
          git push -f origin "$RELEASE_BRANCH"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        run: |
          python3 -m py_compile backend/app/main.py scripts/release/bump.py scripts/release/changelog.py
          node --check frontend/app.js
          sh -n install.sh
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish DGX Spark image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.prepare.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=DGX Spark Dashboard
            org.opencontainers.image.description=Lightweight host monitoring for NVIDIA DGX Spark
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Package clone-free deployment bundle
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          cp install.sh docker-compose.yml docker-compose.gpu.yml docker-compose.cdi.yml .env.example dist/deploy/
          printf '%s\n' "$VERSION" > dist/deploy/VERSION
          touch dist/deploy/.dgx-dashboard-release
          tar -czf dist/dgx-spark-dashboard-deploy.tar.gz -C dist/deploy .
          cd dist
          sha256sum dgx-spark-dashboard-deploy.tar.gz > dgx-spark-dashboard-deploy.tar.gz.sha256

      - name: Promote release into main via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "Release ${TAG}" \
            --body "Automated release ${TAG}. Merges the staged release into main."
          # Mergeability is computed asynchronously; retry briefly.
          for _ in $(seq 1 10); do
            if gh pr merge "$RELEASE_BRANCH" --merge; then break; fi
            sleep 6
          done
          git fetch origin main --tags
          # Tag the merged commit on main and push the tag (tag creation is allowed).
          git tag -a "$TAG" origin/main -F release-notes.md
          git push origin "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Release $TAG" \
            --notes-file release-notes.md \
            dist/dgx-spark-dashboard-deploy.tar.gz \
            dist/dgx-spark-dashboard-deploy.tar.gz.sha256

      - name: Sync release into develop via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
        run: |
          set -euo pipefail
          if ! gh pr create --base develop --head "$RELEASE_BRANCH" \
            --title "chore: sync ${TAG} into develop" \
            --body "Brings the release commit for ${TAG} back into develop."; then
            echo "No sync PR needed; develop already contains ${TAG}."
            exit 0
          fi
          for _ in $(seq 1 10); do
            if gh pr merge "$RELEASE_BRANCH" --merge --delete-branch; then break; fi
            sleep 6
          done
