# Merge-request gate, mirroring the build -> test -> security stages of the
# singhangad.in pipeline, adapted to this repo's stack (Python + vanilla JS +
# shell + Docker Compose). Runs on every pull request into main or develop; the
# jobs are wired as required status checks so an MR cannot merge until they pass.
name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python3 -m py_compile backend/app/main.py backend/app/serve.py scripts/release/bump.py scripts/release/changelog.py
      - name: Frontend JS parses
        run: node --check frontend/app.js
      - name: Installer shell parses
        run: sh -n install.sh
      - name: Compose config resolves
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Smoke-build the image (native amd64, not pushed) so a broken Dockerfile or
      # dependency set fails the MR. The release workflow builds the arm64 artifact.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Secret detection over full history, mirroring the pipeline's gitleaks job.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose
